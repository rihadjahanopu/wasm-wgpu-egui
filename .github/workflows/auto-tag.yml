name: 🏷️ Auto Tag on Version Bump

on:
  push:
    branches: [main, master]
    paths:
      - 'Cargo.toml'

permissions:
  contents: write

jobs:
  auto-tag:
    name: 🏷️ Detect Version & Create Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to compare

      - name: Get Current Version
        id: current
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Current version: $VERSION"

      - name: Get Previous Version
        id: previous
        run: |
          PREV_VERSION=$(git show HEAD~1:Cargo.toml 2>/dev/null | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/' || echo "none")
          echo "version=$PREV_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Previous version: $PREV_VERSION"

      - name: Check If Tag Already Exists
        id: tag_check
        run: |
          TAG="v${{ steps.current.outputs.version }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG already exists — skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $TAG does not exist yet."
          fi

      - name: Create & Push Tag
        if: |
          steps.current.outputs.version != steps.previous.outputs.version &&
          steps.tag_check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.current.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "🚀 Release $TAG"
          git push origin "$TAG"
          echo "🎉 Tag $TAG created and pushed!"

      - name: No Version Change
        if: steps.current.outputs.version == steps.previous.outputs.version
        run: |
          echo "ℹ️ Cargo.toml changed but version is same (${{ steps.current.outputs.version }}) — no tag created."
