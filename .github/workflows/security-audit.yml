name: 🛡️ Security Audit & License Compliance

on:
  schedule:
    - cron: "0 0 * * 0" # Runs every Sunday at midnight
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. RustSec Vulnerability Scanner (cargo-audit)
  # ---------------------------------------------------------------------------
  audit:
    name: 🔒 RustSec Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2. Dependency License & Advisory Gate (cargo-deny)
  # ---------------------------------------------------------------------------
  license-and-bans:
    name: 📜 License & Supply-Chain Deny Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
