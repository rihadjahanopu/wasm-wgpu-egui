[package]
name = "wasm-wgpu-egui"
version = "0.2.0"
edition = "2024"
authors = ["Rihad Jahan Opu <https://rihadjahanopu.com>"]
homepage = "https://rihadjahanopu.com"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Graphics & Windowing
wgpu = { version = "22.0", default-features = false, features = ["webgpu", "wgsl"] }
winit = { version = "0.30", features = ["rwh_06"] }

# GUI
egui = "0.29"
egui-wgpu = { version = "0.29", features = ["winit"] }
egui-winit = { version = "0.29", default-features = false }

# Math & Byte utilities
glam = { version = "0.28", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "Performance",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false

