# -----------------------------------------------------------------------------
# ⚡ WGPU Studio — Cargo Deny Policy
# Developed by Rihad Jahan Opu <https://rihadjahanopu.com>
# -----------------------------------------------------------------------------

[advisories]
version = 2
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "OpenSSL",
]

[bans]
version = 2
multiple-versions = "warn"
wildcards = "allow"

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
