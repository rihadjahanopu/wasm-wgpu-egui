<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4296FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="#141419"/>
  <!-- 3D Isometric Cube -->
  <polygon points="128,40 208,86 128,132 48,86" fill="url(#grad)" opacity="0.95"/>
  <polygon points="48,86 128,132 128,216 48,170" fill="#3B82F6" opacity="0.85"/>
  <polygon points="208,86 128,132 128,216 208,170" fill="#8B5CF6" opacity="0.75"/>
  <!-- Lightning bolt overlay -->
  <polygon points="138,65 110,120 132,120 118,175 156,110 134,110" fill="#FBBF24" filter="url(#glow)"/>
</svg>